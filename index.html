<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>高校マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        /* デフォルト（PCなど大画面）のラベル設定 */
        .custom-label {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #999;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1.3;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .home-label {
            background: rgba(255, 100, 100, 0.9);
            color: white;
            font-weight: bold;
            border: 1px solid #d9534f;
        }

        /* 📱 スマホ画面（幅768px以下）での文字サイズ自動拡大 */
        @media (max-width: 768px) {
            .custom-label {
                font-size: 15px; 
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // マップの初期化
        var map = L.map('map').setView([35.5, 139.6], 12);

        // 🗺️ 【完全無料・APIキー不要】標準的で安定しているOpenStreetMapタイルに戻すで！
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 位置データリスト
        var locations = [
            // ベース
            {
                name: "横浜市東部病院",
                lat: 35.523766, 
                lng: 139.674982, 
                info: "",
                isHome: true
            },
            // 岸根高校
            {
                name: "県立岸根高校",
                lat: 35.501312,
                lng: 139.613527,
                info: "新横浜駅から徒歩15分<br>52 / 1.32",
                isHome: false
            },
            // 新羽高校
            {
                name: "県立新羽高校",
                lat: 35.520439,
                lng: 139.605275,
                info: "北新横浜駅から徒歩13分<br>39.7 / 1.09",
                isHome: false
            },
            // 横浜立野
            {
                name: "県立横浜立野高校",
                lat: 35.418577,
                lng: 139.653785,
                info: "根岸駅から徒歩20分<br>47.6 / 1.18",
                isHome: false
            },
            // 城郷高校
            {
                name: "県立城郷高校",
                lat: 35.491153,
                lng: 139.600978,
                info: "片倉町駅から徒歩10分<br>46.7 / 1.13",
                isHome: false
            },
            // 横浜創学館
            {
                name: "私立横浜創学館高校",
                lat: 35.322513,
                lng: 139.630059,
                info: "追浜/金沢八景駅から徒歩15分<br>41(総合進学クラス一般)",
                isHome: false
            },
            // 横浜清風
            {
                name: "私立横浜清風高校",
                lat: 35.4416,
                lng: 139.598224,
                info: "保土ヶ谷駅から徒歩8分<br>46(総合進学)",
                isHome: false
            },
            // 横浜高校
            {
                name: "私立横浜高校",
                lat: 35.362677,
                lng: 139.62753,
                info: "能見台駅から徒歩2分<br>44(アクティブ)",
                isHome: false
            },
            // 羽田国際
            {
                name: "私立羽田国際高校",
                lat: 35.549397,
                lng: 139.727986,
                info: "糀谷駅から徒歩7分<br>43(総合進学)",
                isHome: false
            }
        ];

        var bounds = [];

        // ピンとラベルの追加
        locations.forEach(function(loc) {
            var marker = L.marker([loc.lat, loc.lng]).addTo(map);
            bounds.push([loc.lat, loc.lng]);

            if (loc.isHome) {
                marker.bindPopup("自宅");
                marker.bindTooltip("自宅", {
                    permanent: true,
                    direction: 'right',
                    className: 'custom-label home-label'
                });
            } else {
                var labelContent = "<b>" + loc.name + "</b><br>" + loc.info;
                marker.bindTooltip(labelContent, {
                    permanent: true,
                    direction: 'right',
                    className: 'custom-label'
                });
                marker.bindPopup(labelContent);
            }
        });

        // 全てのピンが画面内に収まるように自動調整（スマホでの見やすさを考慮して最大ズームを14に制限）
        if (bounds.length > 0) {
            map.fitBounds(bounds, { 
                padding: [50, 50],
                maxZoom: 14 // スマホで引きすぎず、程よく拡大されて見やすくなるで！
            });
        }
    </script>
</body>
</html>
